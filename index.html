<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SaaS Login & Payment Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">SaaS LAB</p>
    <h1>로그인 · 무료 2회 · 결제</h1>
    <p>유료 AI SaaS의 기본 수익화 흐름을 직접 실습합니다.</p>
    <section>
      <h2>1. 로그인</h2>
      <button id="googleLogin">Google로 계속하기</button>
      <button id="logoutButton" hidden>로그아웃</button>
      <p id="loginStatus">로그인 상태 확인 중...</p>
    </section>
    <section>
      <h2>2. 무료 사용</h2>
      <p>무료 사용 가능 횟수: <strong id="freeCount">2</strong>회</p>
      <button id="useService" disabled>서비스 사용하기</button>
    </section>
    <section id="paywall" hidden>
      <h2>3. 결제</h2>
      <p>무료 2회를 모두 사용했습니다.</p>
      <button id="payButton">5,000원 결제하고 계속하기</button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
